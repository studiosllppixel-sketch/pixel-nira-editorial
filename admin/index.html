<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171116"><title>Admin Sign In · NIRA × PIXEL</title><style>
:root{color-scheme:light;--ink:#20151f;--plum:#70204f;--paper:#fbf6f8;--line:#e2d7e0;--muted:#827681}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#171116,#3b2035 55%,#70204f);display:grid;place-items:center;padding:22px;font-family:Arial,sans-serif;color:var(--ink)}main{width:min(100%,430px);background:var(--paper);padding:clamp(26px,7vw,44px);border-radius:18px;box-shadow:0 24px 80px #0005}p.kicker{letter-spacing:.22em;font-size:11px;text-transform:uppercase;color:var(--plum)}h1{font-family:Georgia,serif;font-weight:500;font-size:34px;margin:10px 0}p{color:var(--muted);line-height:1.6;font-size:14px}label{display:block;font-size:12px;font-weight:700;margin:18px 0 7px}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit}button{width:100%;border:0;border-radius:9px;padding:14px;margin-top:22px;background:var(--plum);color:#fff;font-weight:700;font-size:14px}button:disabled{opacity:.6}#message{min-height:24px;color:#a32250;font-size:13px}small{display:block;margin-top:20px;color:var(--muted);font-size:11px;text-align:center}
</style></head><body><main><p class="kicker">PIXEL STUDIOS × NIRA EDITORIAL</p><h1>Admin sign in</h1><p>Sign in to manage editorial pages, drafts and the private media library.</p><form id="login"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="120"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"><button id="submit" type="submit">Sign in securely</button><p id="message" role="status" aria-live="polite"></p></form><small>Private administrator access · Sessions expire after 8 hours</small></main><script>
const form=document.getElementById('login'),button=document.getElementById('submit'),message=document.getElementById('message');
fetch('/api/admin/me',{credentials:'same-origin',cache:'no-store'}).then(r=>r.ok?location.replace('/edit/'):null).catch(()=>{});
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;button.textContent='Signing in…';message.textContent='';try{const r=await fetch('/api/admin/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value.trim(),password:form.password.value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Sign in failed.');location.replace('/edit/');}catch(err){message.textContent=err.message||'Could not sign in. Please try again.';}finally{button.disabled=false;button.textContent='Sign in securely';}});
</script></body></html>
